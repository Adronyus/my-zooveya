name: Finalize My Zooveya

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild My Zooveya project
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk-* > /tmp/my-zooveya.b64
          base64 --decode /tmp/my-zooveya.b64 > /tmp/my-zooveya.tar.xz
          mkdir _project
          tar -xJf /tmp/my-zooveya.tar.xz -C _project

          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name _project -exec rm -rf {} +
          cp -a _project/. .
          rm -rf _project

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Initial commit: My Zooveya!"
          git push
